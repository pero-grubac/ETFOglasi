name: Release

# Push a tag that matches the version in pubspec.yaml (e.g. `1.1.0` or
# `v1.1.0`) to build signed APKs and create a draft GitHub release.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches pubspec.yaml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing (see README → Releasing)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # One APK per CPU type: ~22 MB each instead of ~60 MB. Flutter gives
      # them version codes 1000+N (32-bit) and 2000+N (64-bit), so a
      # universal APK (version code N) must not be published any more.
      - name: Build APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      # Android only installs an update signed with the same key as the
      # installed app (the key used for 1.0.0).
      - name: Check the signing key
        run: |
          expected=a83a43eb0b05044d01f5d8b4557fb70f27b323fb2baa0272e70dfaccb8a37aa6
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$apksigner" verify --print-certs "$apk" | grep -q "SHA-256 digest: $expected" || {
              echo "::error::$apk is not signed with the release key"
              exit 1
            }
          done

      - name: Rename APKs
        run: |
          version=${{ steps.version.outputs.version }}
          mkdir dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/ETFOglasi-$version-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/ETFOglasi-$version-armeabi-v7a.apk"

      # A draft, so the notes can be edited before publishing. The in-app
      # update check only sees published releases.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ETF Oglasi ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ## Download
            - **ETFOglasi-${{ steps.version.outputs.version }}-arm64-v8a.apk** – almost all phones from the last ~8 years.
            - **ETFOglasi-${{ steps.version.outputs.version }}-armeabi-v7a.apk** – only if the first one doesn't install (older phones).

            Install it over the existing app; settings and saved data stay.
