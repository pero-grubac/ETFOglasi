name: etf_oglasi
description: "ETF Banja Luka announcements and class schedules."

publish_to: 'none'


version: 1.1.0+2

environment:
  sdk: ^3.11.0
  flutter: ">=3.38.4"


dependencies:
  flutter:
    sdk: flutter

  json_annotation: ^4.9.0
  http: ^1.3.0
  intl: ^0.20.2
  file_picker: ^10.1.2
  path: ^1.9.1
  open_filex: ^4.7.0
  permission_handler: ^12.0.0+1
  shared_preferences: ^2.5.3
  flutter_riverpod: ^3.0.0
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  workmanager: ^0.10.10
  flutter_local_notifications: ^19.2.1
  flutter_native_splash: ^2.4.6
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  timezone: ^0.10.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

flutter_intl:
  enabled: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path_android: "assets/images/etf_icon.png"

flutter_native_splash:
  color: "#003366"
  image: assets/images/etf_splash.png
  branding: null
  color_dark: "#003366"
  image_dark: assets/images/etf_splash.png
  android: true
  ios: false

